<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Gallery — Aisha Alkhaderi</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="digital-gallery">

<header class="hero-header">
    <h1>Digital Gallery</h1>
    <p>Experience my artworks in a virtual space</p>
    <nav>
        <a href="about.html">About</a>
        <a href="index.html">Gallery</a>
        <a href="content.html">Content</a>
        <a href="digitalgallery.html">Digital</a>
    </nav>
</header>

<section class="digital-gallery-page">
    <img src="digart.jpg" alt="Digital gallery interior" class="digital-gallery-base">

    <!-- LEFT ART -->
    <button class="hotspot left"
        onclick="openArtwork('mix.PNG')">
       
    </button>

    <!-- CENTER ART -->
    <button class="hotspot center"
        onclick="openArtwork('frog.JPG')">
       
    </button>

    <!-- RIGHT ART -->
    <button class="hotspot right"
        onclick="openArtwork('butterfly.JPG')">
       
    </button>
</section>

<!-- MODAL -->
<div id="artModal" class="modal" onclick="closeArtwork()">
    <img id="artModalImg">
</div>

<script>
function openArtwork(src) {
    const modal = document.getElementById("artModal");
    const img = document.getElementById("artModalImg");
    img.src = src;
    modal.style.display = "flex";
}

function closeArtwork() {
    document.getElementById("artModal").style.display = "none";
}
</script>

</body>
</html>
